# Experiment config: plan-experimental E2, arm est_kd_rgbnir.
#
# Student distilled from maestro_rgbnir of the same fold and seed. Treatment of H2.
#
# Trained with src.training.kd_train; evaluated with v4_est_etiquetas.yaml, because
# evaluate_checkpoint.py loads a TrainingConfig, which refuses the KD keys. Besides those
# keys, this file differs from v4_est_etiquetas.yaml only in this header, output_dir and
# batch_size. Runbook: docs/tesis/runbook-v4.md.

# The teacher. scripts/run_kfold.py passes teacher_checkpoint=<teacher run>/best_model.pt
# and stops when that run is missing. KDTrainer._load_teacher builds the teacher from
# THIS fusion_mode and head_strides, so they must match v4_maestro_*.yaml.
teacher_checkpoint: ""
fusion_mode: cross_attention
head_strides: [8, 16, 32]

# KD hyperparameters: configs/kd_training_twostream.yaml.
kd_weight: 1.0
kd_temperature: 1.0
kd_loss_type: mse
distill_levels:
  backbone: 1.0
  fpn: 0.1
  head_cls: 0.3
  head_reg: 0.5

# Not a memory knob here: KDTrainer has no gradient accumulation, so this is the batch of
# each optimizer step and must equal effective_batch for the KD arms to take the steps of
# est_etiquetas. scripts/run_kfold.py passes the rest of the machine profile as overrides.
batch_size: 8

# Data paths. scripts/run_kfold.py replaces all of them with --dataset and the fold:
# rgb_dir, nir_dir (--nir-variant), nir_homography_path, labels_dir, split_manifest.
# The NIR of the v4 dataset is already registered, hence the identity homography.
rgb_dir: "data/cache/v4_captura_v3/rgb"
nir_dir: "data/cache/v4_captura_v3/nir"
nir_homography_path: "data/cache/v4_captura_v3/homographies/identity.npy"
labels_dir: "data/cache/v4_captura_v3/folds_lot/fold_0/labels"
output_dir: "checkpoints/v4/est_kd_rgbnir"
split_manifest: "data/cache/v4_captura_v3/folds_lot/fold_0/splits.json"

model_type: student
backbone_variant: "tiny"
num_classes: 2

# Image
image_size: 640
letterbox_value: 114

# Mango ROI crop, the same in all six arms (a KD teacher and its student share the
# batch). It also picks the `roi` NIR stats of folds_meta.json; `roi_crop: false`
# on all six picks the `frame` ones.
roi_crop: true
roi_crop_margin: 0.10
roi_crop_jitter: 0.5

# Training schedule, the same in the three student arms: single phase, all params
# trainable from epoch 1. Taken from configs/kd_training_twostream.yaml. scripts/run_kfold.py
# passes patience=1000 (no early stopping).
epochs: 80
lr: 0.001
weight_decay: 0.0005
warmup_epochs: 3
patience: 30

# Select on the damage class alone: mango AP is meaningless under the crop.
selection_metric: damage_ap50

# The experimental constant.
effective_batch: 8

# Loss
box_weight: 7.5
cls_weight: 0.5
class_weights: [0.5, 1.5]

# Logging
log_interval: 10
save_interval: 5

# Gradient clipping
grad_clip: 10.0

# NIR normalization: placeholders. scripts/run_kfold.py passes nir_mean and nir_std
# of the fold from <folds-dir>/folds_meta.json.
nir_mean: 0.0569
nir_std: 0.0546

# Reproducibility: scripts/run_kfold.py passes seed=<S>.
seed: 42

# Decode (src/training/decode.py::decode_detections).
conf_threshold: 0.25
nms_iou_threshold: 0.5
nms_enabled: true
decode_per_class: true
max_detections: 300

# Task-Aligned Assigner (src/training/loss.py).
assigner_center_radius: 0.0
assigner_level_ranges: [64, 128]
assigner_collect_stats: false
