# Knowledge Distillation Training Configuration
# Student (YOLO Nano) trained with frozen MasterModel teacher via per-level MSE.

# --- Teacher ---
teacher_checkpoint: checkpoints/mastermodel_mango/best_model.pt

# --- KD Hyperparameters ---
kd_weight: 1.0
kd_temperature: 1.0
distill_levels:
  backbone: 1.0
  fpn: 0.1
  head_cls: 0.3
  head_reg: 0.5

# --- Training (matched to configs/training_student.yaml) ---
# The distilled run is only interpretable against the RGB-only baseline
# if both get the same training budget. epochs/patience/warmup_epochs/
# num_workers below MUST stay in sync with training_student.yaml.
epochs: 50
# Early stopping disabled (0) — must match training_student.yaml, since the
# whole point of this stage is a like-for-like comparison against it.
patience: 0
precision: fp32
batch_size: 8
model_type: student

# --- Model ---
num_classes: 2
backbone_variant: tiny
image_size: 640
letterbox_value: 114

# --- Loss ---
box_weight: 7.5
cls_weight: 0.5
# Class weights: [mango, damage]. Damage is harder to detect (small bboxes, lower contrast),
# so it receives higher loss weight. Values are experimental and should be tuned by validation mAP.
class_weights: [0.5, 1.5]

# --- Optimizer ---
lr: 0.001
weight_decay: 0.0005
grad_clip: 10.0
warmup_epochs: 5

# --- Paths ---
rgb_dir: data/cache/mango/rgb
nir_dir: data/cache/mango/nir
labels_dir: data/annotations/yolo/labels
output_dir: checkpoints/kd_student

# --- DataLoader ---
num_workers: 2

# --- NIR normalization ---
nir_mean: 0.0569
nir_std: 0.0546

# --- Logging ---
log_interval: 10
save_interval: 5

# --- Reproducibility ---
seed: 42

# --- Split manifest (damage-map-audit W0 fail-fast guard) ---
split_manifest: "data/annotations/yolo/splits.json"

# --- Decode (src/training/decode.py::decode_detections) ---
conf_threshold: 0.25
nms_iou_threshold: 0.5
nms_enabled: true
decode_per_class: true
max_detections: 300

# --- Task-Aligned Assigner (default off — see design.md D9) ---
assigner_center_radius: 0.0
assigner_level_ranges: [64, 128]
assigner_collect_stats: false
