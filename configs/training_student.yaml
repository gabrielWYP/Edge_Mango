# Training config for StudentModel — RGB-only single-phase training
# Student uses cosine+warmup LR with all params trainable from epoch 1

# Model type
model_type: "student"

# Data paths (no nir_dir needed for student)
rgb_dir: "data/cache/mango/rgb"
labels_dir: "data/annotations/yolo/labels"
output_dir: "checkpoints/student"

# Model
backbone_variant: "tiny"
num_classes: 2

# Image
image_size: 640
letterbox_value: 114

# Training — single-phase
batch_size: 8
epochs: 50
lr: 0.001
weight_decay: 0.0005

# Loss
box_weight: 7.5
cls_weight: 0.5
# Class weights: [mango, damage]. Damage is harder to detect (small bboxes, lower contrast),
# so it receives higher loss weight. Values are experimental and should be tuned by validation mAP.
class_weights: [0.5, 1.5]

# Scheduler
warmup_epochs: 5
# Early stopping disabled (0) — see configs/training_mango.yaml. This baseline
# is what the distilled stage is measured against, so it must receive the full
# epoch budget: a baseline that stops early while the distilled run continues
# would make the comparison meaningless.
patience: 0

# Logging
log_interval: 5
save_interval: 10

# Mixed precision
precision: fp32

# Gradient clipping
grad_clip: 10.0

# DataLoader
num_workers: 2

# NIR normalization stats (unused by student, kept for config compat)
nir_mean: 0.0569
nir_std: 0.0546

# Reproducibility
seed: 42

# Split manifest — YOLODataset raises if a split's label directory diverges
# from this file (fail-fast guard against the leaked-split defect fixed in
# damage-map-audit W0). Run `scripts/prepare_yolo_splits.py --reconcile` first.
split_manifest: "data/annotations/yolo/splits.json"

# Decode (src/training/decode.py::decode_detections). Defaults below fix the
# eval-metric defect (missing NMS, argmax-only decode) — see
# openspec/changes/damage-map-audit/specs/training-loop/spec.md.
conf_threshold: 0.25
nms_iou_threshold: 0.5
nms_enabled: true
decode_per_class: true
max_detections: 300

# Task-Aligned Assigner (src/training/loss.py). `assigner_center_radius: 0.0`
# ships as the DEFAULT (legacy strict containment) so pre-fix behavior stays
# measurable — see openspec/changes/damage-map-audit/design.md D9. Only flip
# to a nonzero radius (e.g. 2.5) for the E4 assigner-fix experiment.
assigner_center_radius: 0.0
assigner_level_ranges: [64, 128]
assigner_collect_stats: false
