# Training config for MasterModel — Mango damage detection
# Small-dataset strategy: Phase 1 only (frozen backbone), aggressive augmentations
#
# fusion-redesign: this file preserves the PRE-redesign architecture and
# two-phase schedule (`head_strides: [8, 16, 32]`, `schedule: two_phase`),
# explicitly, so it keeps working end-to-end as a historical baseline. The
# new architecture's experiment lives in configs/experiment/fusion.yaml —
# see openspec/changes/fusion-redesign/design.md D-H. No v1 checkpoint
# trained under this file loads into the redesigned MasterModel (arch_version
# hard break, design.md D-C).

# Data paths
rgb_dir: "data/cache/mango/rgb"
nir_dir: "data/cache/mango/nir"
# Register NIR to the RGB frame at load time (labels are in the RGB frame).
# Runs before 2026-10 trained on unregistered NIR; null = explicit ablation only.
nir_homography_path: "notebooks/matriz_homografia_aruco.npy"
labels_dir: "data/annotations/yolo/labels"
output_dir: "checkpoints/mastermodel_mango"

# Model
backbone_variant: "tiny"
num_classes: 2

# Image
image_size: 640
letterbox_value: 114

# Architecture: pre-redesign 3-level pyramid (no P2), matching the 2-entry
# assigner_level_ranges below. schedule: two_phase preserves the frozen ->
# partial-unfreeze schedule this file was designed around (fusion-redesign
# D-4 default is "end_to_end"; this config opts back out explicitly).
head_strides: [8, 16, 32]
schedule: two_phase

# Training — Phase 1 warmup + Phase 2 backbone unfreeze
# batch_size: 2, not the historical 8 — measured OOM at 13.54 GB on the
# 6.44 GB local GPU (fusion-redesign proposal.md Round 2). effective_batch
# (D-H) keeps the previous nominal batch-8 schedule comparable via
# gradient accumulation.
batch_size: 2
effective_batch: 8
epochs_phase1: 80
epochs_phase2: 10          # Short Phase 2 — unfreeze stages 3-4 with low LR
lr_phase1: 0.001
lr_phase2: 0.0001          # Lower LR for backbone fine-tuning
weight_decay: 0.0005

# Loss
box_weight: 7.5
cls_weight: 0.5
# Class weights: [mango, damage]. Damage is harder to detect (small bboxes, lower contrast),
# so it receives higher loss weight. Values are experimental and should be tuned by validation mAP.
class_weights: [0.5, 1.5]

# Scheduler
warmup_epochs: 5
patience: 20               # Reduced patience for faster convergence on small dataset

# Logging
log_interval: 5
save_interval: 10

# Mixed precision
precision: fp32  # FP16 causes NaN in YOLOv8Loss — using FP32

# Gradient clipping
grad_clip: 10.0

# DataLoader
num_workers: 2             # Conservative for small dataset

# NIR normalization stats
nir_mean: 0.0569
nir_std: 0.0546

# Reproducibility
seed: 42

# Split manifest — YOLODataset raises if a split's label directory diverges
# from this file (fail-fast guard against the leaked-split defect fixed in
# damage-map-audit W0). Run `scripts/prepare_yolo_splits.py --reconcile` first.
split_manifest: "data/annotations/yolo/splits.json"

# Decode (src/training/decode.py::decode_detections). Defaults below fix the
# eval-metric defect (missing NMS, argmax-only decode) — see
# openspec/changes/damage-map-audit/specs/training-loop/spec.md.
conf_threshold: 0.25
nms_iou_threshold: 0.5
nms_enabled: true
decode_per_class: true
max_detections: 300

# Task-Aligned Assigner (src/training/loss.py). `assigner_center_radius: 0.0`
# ships as the DEFAULT (legacy strict containment) so pre-fix behavior stays
# measurable — see openspec/changes/damage-map-audit/design.md D9.
assigner_center_radius: 0.0
assigner_level_ranges: [64, 128]
assigner_collect_stats: false
